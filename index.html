<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jogo Civilizatório</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* Estilo de atlas histórico: escuro e sóbrio, dourado fosco para destaque (docs/interface.md) */
    :root {
      --bg: #131519; --panel: #1b1e24; --panel2: #22262d; --line: #343841; --text: #e4e1d8; --dim: #9a978e;
      --gold: #c2a46a; --green: #86b382; --red: #cf6b62; --blue: #7d9fc4; --orange: #d39a52;
      --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
      --sans: Inter, system-ui, "Segoe UI", sans-serif;
      --top: 64px; --bottom: 58px; --menu: 236px;
    }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font: 13px/1.45 var(--sans); }
    #map { display: block; width: 100vw; height: 100vh; cursor: grab; }
    #map:active { cursor: grabbing; }
    .ic { vertical-align: -3px; flex: none; }
    .art { vertical-align: -4px; flex: none; }
    button { font: inherit; color: inherit; background: var(--panel2); border: 1px solid var(--line); border-radius: 3px; padding: 3px 9px; cursor: pointer; }
    button:hover { border-color: var(--gold); }
    select, input[type=number], input[type=text] { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 3px; padding: 3px 6px; }
    select:hover, select:focus, input:focus { border-color: var(--gold); outline: none; }
    select option { background: var(--panel); color: var(--text); }
    select option:disabled { color: #666; }
    input[type=checkbox] { accent-color: var(--gold); }
    button.on { border-color: var(--gold); color: var(--gold); background: #2a2a24; }
    .num { font-variant-numeric: tabular-nums; }
    .up { color: var(--red); } .down { color: var(--green); } .bad { color: var(--red); font-weight: 600; } .warn { color: var(--orange); }
    .serif { font-family: var(--serif); }

    /* barra superior */
    #topbar { position: fixed; top: 0; left: 0; right: 0; height: var(--top); background: linear-gradient(#1d2026, #17191e); border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between; padding: 0 14px; gap: 16px; z-index: 5; }
    #topbar .who { display: flex; align-items: center; gap: 10px; min-width: 0; }
    #topbar .who img { width: 42px; height: 28px; border: 1px solid var(--line); }
    #topbar .name { font: 600 21px/1.1 var(--serif); color: var(--gold); white-space: nowrap; }
    #topbar .sub { color: var(--dim); font-size: 11px; white-space: nowrap; }
    #topbar .when { text-align: center; }
    #topbar .when .date { font: 600 17px var(--serif); }
    #topbar .when .bar { width: 180px; height: 3px; background: var(--line); margin: 3px auto 0; }
    #topbar .when .bar > div { height: 3px; background: var(--gold); }
    #topbar .stats { display: flex; gap: 16px; }
    #topbar .stat { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
    #topbar .stat small { color: var(--dim); }

    /* menu lateral */
    #leftmenu { position: fixed; top: var(--top); bottom: var(--bottom); left: 0; width: var(--menu); background: var(--panel); border-right: 1px solid var(--line);
      display: flex; flex-direction: column; padding: 8px 0; z-index: 4; overflow-y: auto; }
    #leftmenu .item { display: flex; align-items: center; gap: 10px; padding: 7px 16px; border: 0; border-left: 3px solid transparent; border-radius: 0; background: none; text-align: left; color: var(--dim); }
    #leftmenu .item:hover { color: var(--text); background: #20232a; }
    #leftmenu .item.on { color: var(--text); background: #252830; border-left-color: var(--gold); }
    #leftmenu .sep { border-top: 1px solid var(--line); margin: 8px 14px; }
    #leftmenu .tools { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 14px; }

    /* painel da categoria (ao lado do menu) e painel contextual (direita) */
    #catpanel, #panel { position: fixed; top: calc(var(--top) + 8px); bottom: calc(var(--bottom) + 8px); background: var(--panel); border: 1px solid var(--line);
      overflow-y: auto; padding: 12px 14px; z-index: 3; }
    #catpanel { left: calc(var(--menu) + 8px); width: 380px; }
    #catpanel.wide { width: min(980px, calc(100vw - var(--menu) - 420px)); }
    #panel { right: 8px; width: 350px; }
    #catpanel:empty, #panel:empty { display: none; }
    #catpanel.full { left: 8px; right: 8px; z-index: 20; width: auto; padding: 0; overflow: hidden; display: flex; flex-direction: column; }
    #catpanel.full .ttop { padding: 10px 14px 6px; border-bottom: 1px solid var(--line); max-height: 40%; overflow: auto; }
    #catpanel.full .tview { position: relative; flex: 1; overflow: hidden; cursor: grab; background: #16181c; }
    #catpanel.full .tworld { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
    #catpanel.full .tscroll { overflow: visible; }
    h2 { font: 600 22px/1.1 var(--serif); color: var(--gold); margin: 0 0 8px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
    h3 { font: 600 17px var(--serif); margin: 10px 0 4px; }
    #panel h3 small, h2 small { font: 400 12px var(--sans); color: var(--dim); }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    td { padding: 2px 4px; border-bottom: 1px solid #262930; } td:not(:first-child) { text-align: right; font-variant-numeric: tabular-nums; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; margin: 2px 0 8px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin: 6px 0 10px; }
    .card { background: var(--panel2); border: 1px solid var(--line); padding: 8px 10px; }
    .card .k { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
    .card .v { font: 600 18px var(--sans); font-variant-numeric: tabular-nums; }
    .tabs { display: flex; gap: 2px; margin: 4px 0 8px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    .tabs button { border-bottom: none; border-radius: 3px 3px 0 0; padding: 4px 9px; font-size: 12px; }
    .unit { background: var(--panel2); border: 1px solid var(--line); padding: 6px 8px; margin-bottom: 8px; }
    .bar { background: var(--line); height: 5px; margin: 3px 0; overflow: hidden; }
    .bar > div { height: 5px; }
    .laws td { vertical-align: top; }
    .law-cat { padding-top: 8px !important; color: var(--gold); }

    /* camadas do mapa */
    #maptools { position: fixed; bottom: calc(var(--bottom) + 10px); left: calc(var(--menu) + 10px); z-index: 4; }
    #maptools > button { background: #1b1e24ee; padding: 5px 10px; }
    #modebar { position: fixed; bottom: calc(var(--bottom) + 10px); right: 374px; z-index: 4; display: flex; gap: 2px; background: #1b1e24ee; border: 1px solid var(--line); padding: 3px; }
    #modebar button { display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px; border-bottom: 2px solid transparent; }
    @media (max-width: 1100px) { #modebar { right: 10px; bottom: calc(var(--bottom) + 52px); } #modebar .lbl { display: none; } }
    #modebar button.on { border-bottom-color: var(--gold); color: var(--gold); background: #2a2a24; }
    .bcards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .bcard { border: 1px solid var(--line); background: var(--panel2); padding: 6px; font-size: 11px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
    .bcard:hover { border-color: var(--gold); } .bcard.on { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
    .bcard b { font-size: 12px; } .bcard small { color: var(--dim); }
    #maptools .legend { background: #1b1e24ee; border: 1px solid var(--line); padding: 6px 8px; margin-bottom: 6px; max-width: 420px; max-height: 160px; overflow: auto; display: flex; flex-wrap: wrap; gap: 3px 10px; font-size: 11px; color: var(--dim); }
    #maptools .legend span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
    #maptools .legend i { display: inline-block; width: 14px; height: 10px; border: 1px solid #0006; }
    #maptools .legend span:only-child i { width: 60px; }
    #maptools .maps { position: absolute; bottom: 34px; left: 0; display: flex; flex-direction: column; gap: 6px; background: #1b1e24f2;
      border: 1px solid var(--line); padding: 8px 10px; min-width: 260px; }
    #maptools .grp { display: flex; flex-wrap: wrap; gap: 2px; align-items: center; }
    #maptools .grp span { color: var(--dim); font-size: 10px; text-transform: uppercase; margin-right: 3px; }
    #maptools button { padding: 2px 7px; font-size: 12px; }

    /* barra inferior */
    #bottombar { position: fixed; left: 0; right: 0; bottom: 0; height: var(--bottom); background: linear-gradient(#17191e, #1d2026); border-top: 1px solid var(--line);
      display: flex; align-items: center; gap: 12px; padding: 0 14px; z-index: 5; }
    #bottombar .hover { flex: 1; color: var(--dim); font-size: 11px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    #bottombar .notes { display: flex; gap: 6px; }
    #bottombar .notes button { position: relative; }
    #bottombar .notes b { position: absolute; top: -6px; right: -6px; background: var(--gold); color: #111; border-radius: 8px; font-size: 10px; padding: 0 4px; }
    #notelist { position: fixed; right: 14px; bottom: calc(var(--bottom) + 6px); width: 360px; max-height: 45vh; overflow-y: auto; background: var(--panel);
      border: 1px solid var(--line); padding: 8px; z-index: 6; display: none; }
    #notelist .n { border-bottom: 1px solid var(--line); padding: 4px 0; font-size: 12px; }
    #notelist .n small { color: var(--dim); }
    #toast { position: fixed; bottom: calc(var(--bottom) + 10px); left: 50%; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--gold);
      padding: 5px 12px; z-index: 6; display: none; }

    /* árvore tecnológica */
    .tscroll { overflow: auto; margin-top: 8px; }
    .tree { position: relative; }
    .tera { position: absolute; top: 0; border-left: 1px solid #2a2d33; } .tera.odd { background: rgba(255,255,255,.025); }
    .tera span { position: absolute; top: 6px; left: 10px; font: 600 15px var(--serif); color: var(--gold); white-space: nowrap; }
    .tband { position: absolute; left: 0; border-top: 1px solid var(--line); }
    .tband span { position: absolute; top: 6px; left: 8px; color: var(--gold); font: 600 13px var(--serif); text-transform: uppercase; letter-spacing: .05em; }
    .tree .tlines { position: absolute; left: 0; top: 0; pointer-events: none; fill: none; stroke: #4a4d55; stroke-width: 1.4; }
    .tree .tlines .a { stroke: var(--gold); } .tree .tlines .k { stroke: #4f6b4c; } .tree .tlines .r { stroke: #8cc8ff; } .tree .tlines .p { stroke: #4a4d55; stroke-dasharray: 5 4; }
    .tree .tlines .hl { stroke-width: 3; }
    .tree .text { position: absolute; z-index: 2; font-size: 10.5px; white-space: nowrap; padding-left: 6px; border-left: 2px solid; line-height: 12px; cursor: pointer; background: #16181ccc; }
    .tree .text.k { color: #8fb98a; border-color: #4f6b4c; } .tree .text.r { color: #8cc8ff; border-color: #8cc8ff; } .tree .text.p { color: #e0a070; border-color: #e0a070; }
    .tcard.ext { border-top: 2px solid #e0a070; } .tcard.sel { box-shadow: 0 0 0 2px #fff; } .tcard.path { box-shadow: 0 0 0 2px var(--gold); } .tcard.dep { box-shadow: 0 0 0 2px #8cc8ff; }
    .tlegend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11px; color: var(--dim); margin: 4px 0; }
    .tlegend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 4px; }
    .tlegend i.k { border-color: #4f6b4c; } .tlegend i.a { border-color: var(--gold); } .tlegend i.r { border-color: #8cc8ff; } .tlegend i.p { border-color: #4a4d55; border-top-style: dashed; }
    .tlegend .text { color: #e0a070; border-left: 2px solid #e0a070; padding-left: 4px; font-weight: 400; }
    .tcard { position: absolute; z-index: 1; box-sizing: border-box; overflow: hidden; background: var(--panel2); border: 1px solid var(--line); padding: 5px 7px; font-size: 12px; display: flex; flex-direction: column; gap: 1px; }
    .tcard b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tcard small { color: var(--dim); } .tcard .fx { font-size: 10.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .tcard.known { border-color: #4f6b4c; } .tcard.known b { color: var(--green); }
    .tcard.avail { border-color: var(--gold); cursor: pointer; } .tcard.avail:hover { background: #2a2a24; }
    .tcard.locked { opacity: .45; }
    .tcard.cur { box-shadow: inset 3px 0 0 var(--gold); }

    /* evento: documento histórico com moldura discreta */
    .doc { display: none; position: fixed; top: 18%; left: 50%; transform: translateX(-50%); width: 420px; z-index: 10; padding: 16px 18px;
      background: linear-gradient(#26241f, #1f1d19); border: 1px solid var(--gold); outline: 1px solid #5a4d33; outline-offset: -6px; color: #ece4cf; }
    .doc-head { display: flex; gap: 10px; align-items: center; cursor: move; user-select: none; }
    .doc-head img { width: 42px; height: 28px; border: 1px solid #5a4d33; }
    .doc-head h2 { border: 0; margin: 0; padding: 0; }
    .doc-date { color: #b4a782; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }
    .doc-art { display: flex; justify-content: center; padding: 12px 0; margin: 8px 0; border-top: 1px solid #4a4030; border-bottom: 1px solid #4a4030; color: var(--gold); }
    .doc-text { font: 500 16px/1.4 var(--serif); }
    .doc-k { color: #b4a782; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; margin: 8px 0 4px; }
    .doc-opt { display: block; width: 100%; margin: 4px 0; padding: 7px 10px; text-align: left; background: #2c2924; border-color: #5a4d33; }
    .doc-opt small { color: #b4a782; }
  </style>
</head>
<body>
  <canvas id="map"></canvas>
  <canvas id="units" style="position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none"></canvas>
  <div id="topbar"></div>
  <div id="maptools"></div>
  <div id="modebar"></div>
  <div id="leftmenu"></div>
  <div id="catpanel"></div>
  <div id="panel"></div>
  <div id="bottombar"></div>
  <div id="notelist"></div>
  <div id="toast"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
